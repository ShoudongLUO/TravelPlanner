name: CI

on:
  push:
    branches: [feature/itinerary-route-map]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --runInBand
      - name: Audit legacy full-repository lint
        continue-on-error: true
        run: npm run lint
      - name: Enforce lint on changed files
        shell: bash
        run: |
          mapfile -d '' -t changed_files < <(
            git diff -z --name-only --diff-filter=ACMR origin/main...HEAD -- \
              '*.ts' '*.tsx' '*.mjs'
          )
          if ((${#changed_files[@]} == 0)); then
            echo "No changed lintable files."
            exit 0
          fi
          printf 'Linting %s\n' "${changed_files[@]}"
          npx eslint --max-warnings 0 -- "${changed_files[@]}"
      - name: Build application
        run: npm run build
